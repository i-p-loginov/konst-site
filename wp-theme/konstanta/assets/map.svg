<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" class="lenoblast-map" role="img" aria-label="Карта отделений ООО Константа">
  <g id="districts">
    <!-- Выборгское -->
    <path class="map-district" data-id="vyborgskiy" data-branch="vyborgskoe" d="M40 40 L280 30 L300 100 L250 170 L180 200 L90 190 L50 140 L40 80 Z"/>
    <!-- Пригородное (Всеволожский участок) -->
    <path class="map-district map-district-site" data-id="vsevolozhskiy" data-branch="prigorodnoe" data-site="1" d="M250 140 L340 130 L370 190 L340 250 L260 260 L220 210 L230 160 Z"/>
    <!-- Кировское -->
    <path class="map-district" data-id="kirovskiy" data-branch="kirovskoe" d="M340 130 L420 125 L450 185 L420 250 L350 260 L340 250 L370 190 Z"/>
    <!-- Волховское -->
    <path class="map-district" data-id="volkhovskiy" data-branch="volkhovskoe" d="M420 125 L540 110 L570 180 L540 250 L450 260 L420 250 L450 185 Z"/>
    <!-- Лодейнопольское -->
    <path class="map-district" data-id="lodeynopolskiy" data-branch="lodeynopolskoe" d="M540 70 L700 55 L730 140 L680 190 L570 180 L540 110 Z"/>
    <!-- Тихвинское -->
    <path class="map-district" data-id="tikhvinskiy" data-branch="tikhvinskoe" d="M570 180 L650 170 L680 240 L640 310 L560 300 L540 250 L680 190 Z"/>
    <!-- Бокситогорский участок (в составе Тихвинского) -->
    <path class="map-district map-district-site" data-id="boksitogorskiy" data-branch="tikhvinskoe" data-site="1" d="M650 170 L760 155 L780 240 L740 310 L680 320 L640 310 L680 240 Z"/>
    <!-- Киришское -->
    <path class="map-district" data-id="kirishskiy" data-branch="kirishskoe" d="M450 260 L540 250 L560 300 L520 360 L450 350 L420 300 Z"/>
    <!-- Тосненское -->
    <path class="map-district" data-id="tosnenskiy" data-branch="tosnenskoe" d="M340 250 L420 250 L420 300 L450 350 L390 400 L310 380 L300 300 Z"/>
    <!-- Гатчинское -->
    <path class="map-district" data-id="gatchinskiy" data-branch="gatchinskoe" d="M180 280 L300 300 L310 380 L260 430 L170 410 L150 330 Z"/>
    <!-- Сосновоборский участок -->
    <path class="map-district" data-id="sosnovoborskiy" data-branch="sosnovoborskiy" d="M55 210 L130 220 L150 280 L100 320 L50 300 L45 240 Z"/>
    <!-- Волосовский участок (Кингисеппское) -->
    <path class="map-district map-district-site" data-id="volosovskiy" data-branch="kingiseppskoe" data-site="1" d="M100 340 L150 330 L170 410 L145 470 L85 460 L70 380 Z"/>
    <!-- Кингисеппское -->
    <path class="map-district" data-id="kingiseppskiy" data-branch="kingiseppskoe" d="M15 300 L70 290 L70 380 L85 460 L40 510 L10 430 L12 340 Z"/>
    <!-- Сланцевский участок (Кингисеппское) -->
    <path class="map-district map-district-site" data-id="slantsevskiy" data-branch="kingiseppskoe" data-site="1" d="M40 510 L85 460 L125 490 L105 540 L55 545 L28 520 Z"/>
    <!-- Лужское -->
    <path class="map-district" data-id="luzhskiy" data-branch="luzhskoe" d="M145 470 L260 430 L320 470 L295 530 L185 540 L125 490 Z"/>
  </g>
  <g class="map-labels" aria-hidden="true">
    <text class="map-label" data-for="vyborgskoe" x="150" y="110">Выборгское</text>
    <text class="map-label" data-for="prigorodnoe" x="295" y="185">Пригородное</text>
    <text class="map-label map-label-site" data-for="vsevolozhskiy" x="295" y="215">Всеволожский уч.</text>
    <text class="map-label" data-for="kirovskoe" x="385" y="195">Кировское</text>
    <text class="map-label" data-for="volkhovskoe" x="490" y="185">Волховское</text>
    <text class="map-label" data-for="lodeynopolskoe" x="620" y="120">Лодейнопольское</text>
    <text class="map-label" data-for="tikhvinskoe" x="590" y="235">Тихвинское</text>
    <text class="map-label map-label-site" data-for="boksitogorskiy" x="710" y="250">Бокситогорский уч.</text>
    <text class="map-label" data-for="kirishskoe" x="485" y="305">Киришское</text>
    <text class="map-label" data-for="tosnenskoe" x="375" y="325">Тосненское</text>
    <text class="map-label" data-for="gatchinskoe" x="235" y="355">Гатчинское</text>
    <text class="map-label" data-for="sosnovoborskiy" x="90" y="255">Сосновоборский уч.</text>
    <text class="map-label map-label-site" data-for="volosovskiy" x="125" y="400">Волосовский уч.</text>
    <text class="map-label" data-for="kingiseppskoe" x="42" y="385">Кингисеппское</text>
    <text class="map-label map-label-site" data-for="slantsevskiy" x="75" y="510">Сланцевский уч.</text>
    <text class="map-label" data-for="luzhskoe" x="220" y="490">Лужское</text>
  </g>
  <circle cx="235" cy="235" r="7" fill="#1B2A4A" opacity="0.9"/>
  <text x="248" y="239" class="map-label" style="text-anchor:start;font-size:12px;">СПб</text>
</svg>
